<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bit's Bug Blaster 3D</title>
<link rel="icon" href="data:,">
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #03060d; color: #dffcff;
    font-family: "Courier New", Menlo, Consolas, monospace;
    -webkit-user-select: none; user-select: none; touch-action: none;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  }
  #game { position: fixed; left: 0; top: 0; right: 0; bottom: 0; }
  #game canvas { display: block; }

  #hud {
    position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between;
    align-items: flex-start; gap: 6px; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top));
    pointer-events: none; font-weight: bold; font-size: clamp(14px, 2.8vw, 22px);
    text-shadow: 0 0 8px #19f0ff; background: linear-gradient(rgba(3,6,13,.85), rgba(3,6,13,0));
  }
  .stat { min-width: 3.2em; }
  .stat small { display: block; font-size: .55em; opacity: .75; letter-spacing: .18em; color: #ff8fd0; text-shadow: 0 0 6px #ff3df2; }
  #timeStat.low span { color: #ff5a5a; text-shadow: 0 0 10px #ff2020; }
  #lives { display: inline-flex; gap: 4px; vertical-align: middle; padding-top: .2em; }
  .pip { width: .8em; height: .8em; border-radius: 3px; background: #ffc040; box-shadow: 0 0 8px #ffb020, inset 0 0 0 2px #7a4a00; }
  .pip.off { background: #2a1010; box-shadow: inset 0 0 0 2px #601818; }
  #muteBtn {
    pointer-events: auto; background: rgba(10,20,40,.7); color: #dffcff; border: 1px solid #19f0ff;
    border-radius: 8px; font: inherit; font-size: .8em; padding: 6px 9px; cursor: pointer;
    box-shadow: 0 0 8px rgba(25,240,255,.5);
  }

  #banner {
    position: fixed; left: 0; right: 0; top: 22%; text-align: center; pointer-events: none; opacity: 0;
    font-size: clamp(22px, 6vw, 54px); font-weight: bold; color: #fff; letter-spacing: .08em;
    text-shadow: 0 0 12px #ff3df2, 0 0 30px #ff3df2;
  }
  #banner.show { animation: banner 2s ease-out forwards; }
  @keyframes banner { 0% { opacity: 0; transform: scale(.6); } 12% { opacity: 1; transform: scale(1.08); } 20% { transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: scale(1.05); } }

  #flash { position: fixed; left: 0; top: 0; right: 0; bottom: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, rgba(255,0,0,0) 35%, rgba(255,20,20,.75) 100%); }
  #flash.show { animation: flash .5s ease-out forwards; }
  @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }

  #overlay {
    position: fixed; left: 0; top: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(3,6,13,.62); z-index: 5;
  }
  #overlay.hidden { display: none; }
  #panel {
    width: min(88vw, 520px); max-height: 92vh; box-sizing: border-box; padding: clamp(14px, 3.5vw, 30px); text-align: center;
    background: rgba(6,14,30,.92); border: 2px solid #19f0ff; border-radius: 18px;
    box-shadow: 0 0 24px rgba(25,240,255,.55), inset 0 0 30px rgba(255,61,242,.12);
  }
  #ovTitle {
    margin: 0 0 .4em; font-size: clamp(24px, 6.4vw, 44px); line-height: 1.05; letter-spacing: .04em;
    color: #ff8fd0; text-shadow: 0 0 10px #ff3df2, 0 0 26px #ff3df2;
  }
  #ovTitle b { color: #7df9ff; text-shadow: 0 0 10px #19f0ff, 0 0 26px #19f0ff; }
  #ovText { font-size: clamp(13px, 3.2vw, 17px); line-height: 1.55; margin: 0 0 1.1em; }
  #ovText .k { display: inline-block; border: 1px solid #7df9ff; border-radius: 5px; padding: 0 .4em; color: #7df9ff; margin: 0 1px; }
  #ovText .big { font-size: 1.5em; color: #ffe27a; text-shadow: 0 0 10px #ffb020; }
  #ovText .dim { opacity: .7; font-size: .9em; }
  #ovBtn {
    font: inherit; font-weight: bold; font-size: clamp(16px, 4vw, 22px); letter-spacing: .1em; cursor: pointer;
    color: #03060d; background: #3dff8b; border: 0; border-radius: 12px; padding: .6em 1.6em;
    box-shadow: 0 0 18px #3dff8b; animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform: scale(1.06); box-shadow: 0 0 30px #3dff8b; } }

  #bossBar { display: none; position: fixed; top: max(64px, calc(env(safe-area-inset-top) + 58px)); left: 50%; transform: translateX(-50%);
    width: min(64vw, 380px); text-align: center; font-weight: bold; font-size: 13px; letter-spacing: .2em; color: #ffd6d6;
    text-shadow: 0 0 8px #ff2020; pointer-events: none; }
  #bossBar div { height: 12px; margin-top: 3px; border: 2px solid #ff5a5a; border-radius: 8px; overflow: hidden; background: rgba(40,0,0,.6); box-shadow: 0 0 10px rgba(255,40,40,.6); }
  #bossFill { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff2a2a, #ffb020); }
  .pwr { color: #7dffb0; text-shadow: 0 0 8px #3dff8b; }

  #panel { overflow-y: auto; }
  @media (max-height: 520px) {
    #panel { padding: 10px 16px; width: min(92vw, 600px); }
    #ovTitle { font-size: 22px; margin-bottom: .25em; }
    #ovText { font-size: 12px; line-height: 1.35; margin-bottom: .6em; }
    #ovBtn { font-size: 16px; padding: .45em 1.4em; }
  }

  #touch { display: none; }
  body.touch #touch { display: block; }
  #dpad {
    position: fixed; left: max(14px, env(safe-area-inset-left)); bottom: max(18px, env(safe-area-inset-bottom));
    width: 150px; height: 150px; border-radius: 50%; touch-action: none; z-index: 3;
    background: rgba(10,24,48,.45); border: 2px solid rgba(25,240,255,.6); box-shadow: 0 0 14px rgba(25,240,255,.35);
  }
  #dpad i {
    position: absolute; width: 46px; height: 46px; line-height: 46px; text-align: center; font-style: normal;
    font-size: 24px; color: #7df9ff; pointer-events: none; border-radius: 12px; background: rgba(25,240,255,.1);
  }
  #dpad i.on { background: rgba(25,240,255,.55); color: #fff; }
  #dU { left: 52px; top: 4px; } #dD { left: 52px; bottom: 4px; } #dL { left: 4px; top: 52px; } #dR { right: 4px; top: 52px; }
  #zapBtn {
    position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: max(30px, env(safe-area-inset-bottom));
    width: 112px; height: 112px; border-radius: 50%; touch-action: none; z-index: 3;
    display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 24px; letter-spacing: .08em;
    color: #fff; background: rgba(255,61,242,.3); border: 2px solid #ff3df2; box-shadow: 0 0 16px rgba(255,61,242,.6);
    text-shadow: 0 0 8px #ff3df2;
  }
  #zapBtn.on { background: rgba(255,61,242,.75); transform: scale(.94); }
</style>
</head>
<body>
<div id="game"></div>

<div id="hud">
  <div class="stat"><small>SCORE</small><span id="score">0</span></div>
  <div class="stat"><small>LEVEL</small><span id="level">1</span>/3</div>
  <div class="stat"><small>POWER</small><span id="power" class="pwr">1</span></div>
  <div class="stat" id="timeStat"><small>TIME</small><span id="time">60</span></div>
  <div class="stat"><small>CPU LIVES</small><span id="lives"></span></div>
  <button id="muteBtn" type="button" aria-label="Toggle sound">SND ON</button>
</div>

<div id="banner"></div>
<div id="bossBar">BOSS BUG<div><i id="bossFill"></i></div></div>
<div id="flash"></div>

<div id="touch">
  <div id="dpad"><i id="dU">&#9650;</i><i id="dD">&#9660;</i><i id="dL">&#9664;</i><i id="dR">&#9654;</i></div>
  <div id="zapBtn">ZAP</div>
</div>

<div id="overlay">
  <div id="panel">
    <h1 id="ovTitle">LOADING&hellip;</h1>
    <p id="ovText"></p>
    <button id="ovBtn" type="button" style="display:none">START</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  function $(id) { return document.getElementById(id); }
  var elOverlay = $('overlay'), elTitle = $('ovTitle'), elText = $('ovText'), elBtn = $('ovBtn');

  if (typeof THREE === 'undefined') {
    elTitle.textContent = 'OFFLINE?';
    elText.textContent = 'Could not load Three.js from the CDN. Check your internet connection and reload.';
    return;
  }

  // ------------------------------------------------------------------ config
  var ARENA_X = 14, ARENA_Z = 10.5;      // half-size of the play field
  var CPU_HIT = 1.9;                     // bug reaches the CPU inside this radius
  var CPU_BLOCK = 2.5;                   // Bit can't walk closer than this
  var BIT_SPEED = 10, ZAP_RANGE = 6.5, ZAP_COOLDOWN = 0.24, BIT_SCALE = 1.25;
  var LEVEL_TIME = 60, MAX_LIVES = 5, LIFE_CAP = 8;
  var BOSS_HP = [14, 0, 40], BOSS_TIME = 32;   // a boss bug shows up on odd levels (1 and 3) with 32s left
  // Bit's stats; he levels up after every cleared level (see setPower)
  var P = { level: 0, range: ZAP_RANGE, cool: ZAP_COOLDOWN, speed: BIT_SPEED, wide: 0, dmg: 1, thick: 1 };
  var LEVELS = [
    { spawnStart: 1.55, spawnEnd: 1.10, speedMin: 1.8, speedMax: 2.3, zig: 0.00, sprint: 0.00, tempo: 112 },
    { spawnStart: 1.15, spawnEnd: 0.80, speedMin: 2.2, speedMax: 2.8, zig: 0.30, sprint: 0.08, tempo: 126 },
    { spawnStart: 0.90, spawnEnd: 0.60, speedMin: 2.5, speedMax: 3.2, zig: 0.45, sprint: 0.14, tempo: 140 }
  ];

  var G = { state: 'title', level: 0, score: 0, lives: MAX_LIVES, time: LEVEL_TIME, elapsed: 0, spawnT: 1, shake: 0, best: 0, zapped: 0, bossSpawned: false, bossKills: 0 };
  try { G.best = parseInt(localStorage.getItem('bbb3d_best'), 10) || 0; } catch (e) { G.best = 0; }

  var keys = { up: false, down: false, left: false, right: false, fire: false };
  var touch = { x: 0, z: 0, fire: false };

  // ------------------------------------------------------------------ renderer
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true });
  } catch (e) {
    elTitle.textContent = 'NO WEBGL';
    elText.textContent = 'This browser could not start WebGL, which the game needs.';
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x03060d);
  $('game').appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(42, 1, 0.5, 300);
  var camDir = new THREE.Vector3(0, 1, 0.62).normalize();
  var camTarget = new THREE.Vector3(0, 0, 0.4);
  var camBase = new THREE.Vector3();
  var fitPts = [
    new THREE.Vector3(-ARENA_X - 1.2, 0, -ARENA_Z - 1.2), new THREE.Vector3(ARENA_X + 1.2, 0, -ARENA_Z - 1.2),
    new THREE.Vector3(-ARENA_X - 1.2, 0, ARENA_Z + 1.2), new THREE.Vector3(ARENA_X + 1.2, 0, ARENA_Z + 1.2),
    new THREE.Vector3(-ARENA_X, 2.6, -ARENA_Z), new THREE.Vector3(ARENA_X, 2.6, -ARENA_Z)
  ];
  var tmpV = new THREE.Vector3();

  function placeCam(d) {
    camera.position.copy(camDir).multiplyScalar(d).add(camTarget);
    camera.lookAt(camTarget);
    camera.updateMatrixWorld(true);
  }
  function fitCamera() {
    var w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    var isTouch = document.body.classList.contains('touch');
    var topLim = 1 - 2 * Math.min(64, h * 0.2) / h;
    var botLim = -1 + 2 * ((isTouch && h > w) ? Math.min(190, h * 0.3) : 6) / h;
    var lo = 8, hi = 260, i, j, ok, mid, ymin, ymax;
    camera.clearViewOffset();
    function measure(d) {
      placeCam(d);
      ok = true; ymin = 9; ymax = -9;
      for (j = 0; j < fitPts.length; j++) {
        tmpV.copy(fitPts[j]).project(camera);
        if (Math.abs(tmpV.x) > 0.97) ok = false;
        ymin = Math.min(ymin, tmpV.y); ymax = Math.max(ymax, tmpV.y);
      }
      if (ymax - ymin > topLim - botLim) ok = false;
      return ok;
    }
    for (i = 0; i < 22; i++) {
      mid = (lo + hi) / 2;
      if (measure(mid)) hi = mid; else lo = mid;
    }
    measure(hi);
    // slide the picture so the arena sits centred between the HUD and the touch controls
    camera.setViewOffset(w, h, 0, ((topLim + botLim) / 2 - (ymax + ymin) / 2) * h / 2, w, h);
    camBase.copy(camera.position);
  }

  // ------------------------------------------------------------------ helpers
  function mulberry(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function angDiff(a, b) {
    var d = (b - a) % (Math.PI * 2);
    if (d > Math.PI) d -= Math.PI * 2;
    if (d < -Math.PI) d += Math.PI * 2;
    return d;
  }
  function M(geo, mat, x, y, z) {
    var m = new THREE.Mesh(geo, mat);
    m.position.set(x || 0, y || 0, z || 0);
    return m;
  }
  function basic(c) { return new THREE.MeshBasicMaterial({ color: c }); }
  function std(c, e, rough, metal) {
    return new THREE.MeshStandardMaterial({ color: c, emissive: e || 0x000000, roughness: rough === undefined ? 0.5 : rough, metalness: metal || 0 });
  }

  // soft round blob texture, used for fake shadows and neon glows
  var blobTex = (function () {
    var c = document.createElement('canvas'); c.width = c.height = 128;
    var g = c.getContext('2d');
    var gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(255,255,255,1)');
    gr.addColorStop(0.45, 'rgba(255,255,255,0.45)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  })();
  var planeGeo = new THREE.PlaneGeometry(1, 1);
  planeGeo.rotateX(-Math.PI / 2);
  var shadowMat = new THREE.MeshBasicMaterial({ map: blobTex, color: 0x000000, transparent: true, opacity: 0.6, depthWrite: false });
  function glowMat(color, opacity) {
    return new THREE.MeshBasicMaterial({ map: blobTex, color: color, transparent: true, opacity: opacity, depthWrite: false, blending: THREE.AdditiveBlending });
  }
  function blob(mat, size, y) {
    var m = new THREE.Mesh(planeGeo, mat);
    m.scale.set(size, 1, size);
    m.position.y = y;
    return m;
  }

  // ------------------------------------------------------------------ lights
  scene.add(new THREE.AmbientLight(0x9aa8ff, 0.62));
  var sun = new THREE.DirectionalLight(0xffffff, 0.95);
  sun.position.set(-8, 20, 12);
  scene.add(sun);
  var cpuLight = new THREE.PointLight(0xffc040, 1.4, 16);
  cpuLight.position.set(0, 3.2, 0);
  scene.add(cpuLight);

  // ------------------------------------------------------------------ circuit-board floor
  var coarse = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  var PLANE = 56;
  (function buildFloor() {
    var S = coarse ? 1024 : 2048;
    var c = document.createElement('canvas'); c.width = c.height = S;
    var g = c.getContext('2d');
    var k = S / PLANE, glow = S / 2048;
    var rnd = mulberry(4242);
    g.fillStyle = '#04101c'; g.fillRect(0, 0, S, S);
    g.setTransform(k, 0, 0, k, S / 2, S / 2);

    // play-field base
    g.fillStyle = '#071a2c';
    g.fillRect(-ARENA_X - 0.6, -ARENA_Z - 0.6, ARENA_X * 2 + 1.2, ARENA_Z * 2 + 1.2);

    // fine grid
    g.strokeStyle = 'rgba(60,150,200,0.13)'; g.lineWidth = 0.035;
    var i, s;
    g.beginPath();
    for (i = -PLANE / 2; i <= PLANE / 2; i++) { g.moveTo(i, -PLANE / 2); g.lineTo(i, PLANE / 2); g.moveTo(-PLANE / 2, i); g.lineTo(PLANE / 2, i); }
    g.stroke();

    // neon traces with solder pads
    var cols = ['#19f0ff', '#ff3df2', '#3dff8b', '#19f0ff', '#8f7bff'];
    var DX = [1, 1, 0, -1, -1, -1, 0, 1], DZ = [0, 1, 1, 1, 0, -1, -1, -1];
    g.lineJoin = 'round'; g.lineCap = 'round';
    for (i = 0; i < 95; i++) {
      var x = Math.round((rnd() * 2 - 1) * 25), z = Math.round((rnd() * 2 - 1) * 19);
      if (Math.abs(x) < 3.5 && Math.abs(z) < 3.5) continue;
      var d = Math.floor(rnd() * 8), pts = [[x, z]], segs = 2 + Math.floor(rnd() * 4);
      for (s = 0; s < segs; s++) {
        var len = 1 + Math.floor(rnd() * 5), nx = x + DX[d] * len, nz = z + DZ[d] * len;
        if ((Math.abs(nx) < 3.5 && Math.abs(nz) < 3.5) || Math.abs(nx) > 27 || Math.abs(nz) > 27) break;
        x = nx; z = nz; pts.push([x, z]);
        d = (d + (rnd() < 0.5 ? 1 : 7)) % 8;
      }
      if (pts.length < 2) continue;
      var col = cols[Math.floor(rnd() * cols.length)];
      g.shadowColor = col; g.shadowBlur = 14 * glow;
      g.globalAlpha = 0.8; g.strokeStyle = col; g.lineWidth = 0.1;
      g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
      for (s = 1; s < pts.length; s++) g.lineTo(pts[s][0], pts[s][1]);
      g.stroke();
      g.globalAlpha = 1;
      var ends = [pts[0], pts[pts.length - 1]];
      for (s = 0; s < 2; s++) {
        g.fillStyle = col; g.beginPath(); g.arc(ends[s][0], ends[s][1], 0.27, 0, Math.PI * 2); g.fill();
        g.shadowBlur = 0; g.fillStyle = '#04101c'; g.beginPath(); g.arc(ends[s][0], ends[s][1], 0.11, 0, Math.PI * 2); g.fill();
        g.shadowBlur = 14 * glow;
      }
    }

    // gold data buses running into the CPU
    g.shadowColor = '#ffb020'; g.shadowBlur = 10 * glow; g.strokeStyle = '#d9972a'; g.lineWidth = 0.09; g.globalAlpha = 0.9;
    g.beginPath();
    for (i = -1; i <= 1; i++) {
      g.moveTo(i * 0.4, -ARENA_Z); g.lineTo(i * 0.4, -1.8); g.moveTo(i * 0.4, 1.8); g.lineTo(i * 0.4, ARENA_Z);
      g.moveTo(-ARENA_X, i * 0.4); g.lineTo(-1.8, i * 0.4); g.moveTo(1.8, i * 0.4); g.lineTo(ARENA_X, i * 0.4);
    }
    g.stroke();
    g.shadowBlur = 0; g.globalAlpha = 1;

    // silkscreen labels
    var labels = ['R12', 'C7', 'U3', 'BIT-OS', 'D4', 'Q9', 'X1', '3V3', 'GND', 'L2', 'R40', 'C19'];
    g.fillStyle = 'rgba(210,235,255,0.34)';
    for (i = 0; i < labels.length; i++) {
      var lx = (rnd() * 2 - 1) * (ARENA_X - 2), lz = (rnd() * 2 - 1) * (ARENA_Z - 1);
      if (Math.abs(lx) < 4 && Math.abs(lz) < 4) lx += 6;
      g.save(); g.translate(lx, lz); g.scale(0.045, 0.045); g.font = 'bold 12px monospace'; g.fillText(labels[i], 0, 0); g.restore();
    }

    // dim everything outside the arena, then fade the board away into the dark
    g.fillStyle = 'rgba(3,6,13,0.55)';
    g.beginPath();
    g.rect(-PLANE / 2, -PLANE / 2, PLANE, PLANE);
    g.rect(-ARENA_X - 0.6, -ARENA_Z - 0.6, ARENA_X * 2 + 1.2, ARENA_Z * 2 + 1.2);
    g.fill('evenodd');
    g.setTransform(1, 0, 0, 1, 0, 0);
    var vg = g.createRadialGradient(S / 2, S / 2, S * 0.34, S / 2, S / 2, S * 0.5);
    vg.addColorStop(0, 'rgba(3,6,13,0)'); vg.addColorStop(1, 'rgba(3,6,13,1)');
    g.fillStyle = vg; g.fillRect(0, 0, S, S);

    var tex = new THREE.CanvasTexture(c);
    tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    var floor = new THREE.Mesh(new THREE.PlaneGeometry(PLANE, PLANE), new THREE.MeshBasicMaterial({ map: tex }));
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);
  })();

  // neon rails around the arena
  (function buildRails() {
    var railMat = basic(0x19f0ff), postMat = basic(0xff3df2);
    var gx = new THREE.BoxGeometry(ARENA_X * 2 + 1.2, 0.16, 0.14), gz = new THREE.BoxGeometry(0.14, 0.16, ARENA_Z * 2 + 1.2);
    var ex = ARENA_X + 0.6, ez = ARENA_Z + 0.6;
    scene.add(M(gx, railMat, 0, 0.12, -ez)); scene.add(M(gx, railMat, 0, 0.12, ez));
    scene.add(M(gz, railMat, -ex, 0.12, 0)); scene.add(M(gz, railMat, ex, 0.12, 0));
    var gm = glowMat(0x19f0ff, 0.22), a, b;
    a = new THREE.Mesh(planeGeo, gm); a.scale.set(ex * 2 + 2, 1, 1.6); a.position.set(0, 0.03, -ez); scene.add(a);
    b = a.clone(); b.position.z = ez; scene.add(b);

    zap.addEventListener('pointerup', zapEnd); zap.addEventListener('pointercancel', zapEnd);
    if (coarse) document.body.classList.add('touch');
    window.addEventListener('touchstart', enableTouch, { passive: true });
  })();

  // ------------------------------------------------------------------ main loop
  window.addEventListener('resize', fitCamera);
  window.addEventListener('orientationchange', function () { setTimeout(fitCamera, 250); });
  fitCamera();
  updateHUD();
  showTitle();

  var last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    if (G.state === 'playing') update(dt);
    ambient(dt);
    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);

  // small hook so the Tester bot can inspect and drive the game
  window.__BBB = {
    G: G, P: P, bugs: bugs, bit: bit, get boss() { return boss; }, keys: keys, touch: touch, LEVELS: LEVELS,
    step: function (dt) { if (G.state === 'playing') update(dt); ambient(dt); },
    go: function () { overlayReadyAt = 0; overlayGo(); }
  };
})();
</script>
</body>
</html>
